ily:'Fraunces',serif; font-size:22px; margin-bottom:12px;">Nicom System</div>\n          <div style="color:#8FA69B; line-height:1.6;">${e}</div>\n        </div>\n      </div>`}function escapeHtml(e){return String(e??"").replace(/[&<>"']/g,e=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[e]))}let tenantsCache=[];async function checkSesionAdmin(){const{data:{session:e}}=await supabase.auth.getSession();if(!e)return bloquearPantalla('No hay sesión activa. <a href="login.html" style="color:#C9A227;">Inicia sesión</a> con tu cuenta de administrador.'),!1;document.getElementById("who").textContent=e.user.email;const{data:t}=await supabase.from("profiles").select("es_superadmin").eq("id",e.user.id).maybeSingle();return!(!t||!t.es_superadmin)||(bloquearPantalla("Esta cuenta no tiene acceso al panel de administración."),!1)}function estadoTenant(e){const t=e.suscripcion_vence_el&&new Date(e.suscripcion_vence_el)<new Date;return e.activo?t?{texto:"Vencido",clase:"pill-vencido"}:{texto:"Activo",clase:"pill-activo"}:{texto:"Suspendido",clase:"pill-suspendido"}}function fmtFecha(e){return e?new Date(e).toLocaleDateString("es-VE",{day:"2-digit",month:"short",year:"numeric"}):"—"}async function cargarTenants(){const{data:e,error:t}=await supabase.rpc("listar_tenants_admin"),n=document.getElementById("tbody-tenants"),a=document.getElementById("empty-tenants"),i=document.getElementById("resumen");return t?(n.innerHTML="",a.textContent="No se pudo cargar la lista: "+t.message,void(a.style.display="block")):(tenantsCache=e||[],0===tenantsCache.length?(n.innerHTML="",a.style.display="block",void(i.style.display="none")):(a.style.display="none",actualizarResumen(),void pintarTabla(tenantsCache)))}function actualizarResumen(){const e=document.getElementById("resumen");if(0===tenantsCache.length)return void(e.style.display="none");const t=tenantsCache.filter(e=>"Activo"===estadoTenant(e).texto).length,n=tenantsCache.filter(e=>"Vencido"===estadoTenant(e).texto).length,a=tenantsCache.filter(e=>"Suspendido"===estadoTenant(e).texto).length;e.style.display="flex",e.innerHTML=`\n      <span><b>${tenantsCache.length}</b><br>negocios en total</span>\n      <span><b style="color:var(--teal);">${t}</b><br>activos</span>\n      <span><b style="color:var(--rust);">${n}</b><br>vencidos</span>\n      <span><b style="color:var(--muted);">${a}</b><br>suspendidos a mano</span>\n    `}function filaTenantHtml(e){const t=estadoTenant(e);return`\n        <tr data-tenant-id="${e.tenant_id}">\n          <td><b>${escapeHtml(e.nombre)}</b><br><span class="dueno-email">${escapeHtml(e.slug)}</span></td>\n          <td>${escapeHtml(e.dueno_nombre||"—")}<br><span class="dueno-email">${escapeHtml(e.dueno_email||"sin dueño asignado")}</span></td>\n          <td><span class="pill ${t.clase}">${t.texto}</span></td>\n          <td>${fmtFecha(e.suscripcion_vence_el)}</td>\n          <td>${fmtFecha(e.creado_en)}</td>\n          <td>\n            <div class="acciones">\n              <input type="number" min="1" value="30" id="dias-${e.tenant_id}" title="Días a extender">\n              <button class="add" onclick="marcarPago('${e.tenant_id}', this)">Marcar pagado</button>\n              ${e.activo?`<button class="btn-suspender" onclick="cambiarActivo('${e.tenant_id}', false, this)">Suspender</button>`:`<button class="btn-reactivar" onclick="cambiarActivo('${e.tenant_id}', true, this)">Reactivar</button>`}\n            </div>\n            <div class="msg-fila" id="msg-${e.tenant_id}"></div>\n          </td>\n        </tr>`}function pintarTabla(e){const t=document.getElementById("tbody-tenants"),n=document.getElementById("empty-tenants");if(0===e.length)return t.innerHTML="",n.textContent="Ningún negocio coincide con la búsqueda.",void(n.style.display="block");n.style.display="none",t.innerHTML=e.map(filaTenantHtml).join("")}function repintarConFiltroActual(){const e=document.getElementById("filtro").value.trim().toLowerCase();pintarTabla(e?tenantsCache.filter(t=>(t.nomb
