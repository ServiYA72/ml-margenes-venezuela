<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nicom — Cambiar mi contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B17;--surface:#16241F;--surface-2:#1D2E27;--line:#2C3F37;--paper:#EDE8DE;--muted:#8FA69B;--gold:#C9A227;--teal:#3FA796;--rust:#C1553B}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans',sans-serif}
header{border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:18px}.marca img{height:38px}
header a{color:var(--gold);text-decoration:none;font-size:14px}
main{max-width:460px;margin:0 auto;padding:40px 20px}
h1{font-family:Fraunces,serif;font-weight:400;font-size:27px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.panel{background:var(--surface);border:1px solid var(--line);padding:22px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}label:first-of-type{margin-top:0}
.fila{display:flex;gap:8px}input{flex:1;width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--paper);padding:11px 12px;font-size:15px;font-family:inherit}input:focus{outline:0;border-color:var(--gold)}
button{font-family:inherit;cursor:pointer}.ver{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);padding:0 12px;font-size:13px}
.guardar{margin-top:20px;width:100%;background:var(--gold);color:var(--ink);border:0;padding:12px;font-weight:600;font-size:15px}.guardar:disabled{background:var(--line);color:var(--muted)}
#msg{margin-top:14px;font-size:14px;min-height:20px}
</style></head><body>
<header><div class="marca"><img src="logo-nicom.png" alt="Nicom"> Mi cuenta</div><a href="dashboard.html">← Volver al sistema</a></header>
<main><h1>Cambiar mi contraseña</h1><p class="sub" id="quien">Cargando sesión…</p>
<div class="panel"><form id="f" autocomplete="off">
<label for="n1">Contraseña nueva (mínimo 8 caracteres)</label><div class="fila"><input id="n1" type="password" autocomplete="new-password"><button type="button" class="ver" id="ver">Ver</button></div>
<label for="n2">Repite la contraseña nueva</label><input id="n2" type="password" autocomplete="new-password">
<button class="guardar" id="g" type="submit">Guardar contraseña</button><div id="msg"></div></form></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://tkhzuopapvclmcgxyood.supabase.co","sb_publishable_KQB6B6uLIPr-xKdNDc8iEw_7tcWM5gS");
const $=i=>document.getElementById(i),msg=$("msg");
const{data:{session}}=await supabase.auth.getSession();
if(!session){document.querySelector("main").innerHTML='<h1>Entra primero</h1><p class="sub">Necesitas iniciar sesión, o abrir el enlace que te llegó por correo, para cambiar tu contraseña.</p><a href="login.html" style="color:#C9A227">Ir a iniciar sesión →</a>'}
else{$("quien").textContent="Cuenta: "+session.user.email;
$("ver").onclick=()=>{const t=$("n1").type==="password"?"text":"password";$("n1").type=t;$("n2").type=t;$("ver").textContent=t==="text"?"Ocultar":"Ver"};
$("f").onsubmit=async e=>{e.preventDefault();msg.style.color="var(--rust)";
const a=$("n1").value,b=$("n2").value;
if(a.length<8){msg.textContent="La contraseña debe tener al menos 8 caracteres.";return}
if(a!==b){msg.textContent="Las dos contraseñas no coinciden.";return}
$("g").disabled=true;msg.style.color="var(--muted)";msg.textContent="Guardando…";
const{error}=await supabase.auth.updateUser({password:a});
$("g").disabled=false;
if(error){msg.style.color="var(--rust)";msg.textContent=/same|different/i.test(error.message)?"La contraseña nueva debe ser distinta a la actual.":"No se pudo cambiar: "+error.message;return}
$("n1").value="";$("n2").value="";msg.style.color="var(--teal)";msg.textContent="✓ Listo. Tu contraseña fue cambiada. Úsala la próxima vez que entres."}}
</script></body></html>
